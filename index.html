<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Math Studio — Linear Algebra Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="logo"><span>📐</span><h1>Matrix Math Studio</h1></div>
    <a href="https://sabhyamtrivedycoder.github.io/portfolio/" target="_blank" class="nav-portfolio">Portfolio ↗</a>
  </header>
  <main class="main">
    <div class="matrix-grid">
      <div class="card">
        <h3>Matrix A (2x2)</h3>
        <div class="grid-2x2">
          <input type="number" id="a00" value="4">
          <input type="number" id="a01" value="7">
          <input type="number" id="a10" value="2">
          <input type="number" id="a11" value="6">
        </div>
      </div>
      <div class="card">
        <h3>Matrix B (2x2)</h3>
        <div class="grid-2x2">
          <input type="number" id="b00" value="1">
          <input type="number" id="b01" value="0">
          <input type="number" id="b10" value="3">
          <input type="number" id="b11" value="5">
        </div>
      </div>
    </div>
    <div class="card results">
      <h3>Operations & Properties</h3>
      <div class="ops">
        <div><strong>det(A):</strong> <span id="detA">0</span></div>
        <div><strong>trace(A):</strong> <span id="traceA">0</span></div>
        <div><strong>A × B:</strong> <pre id="multAB">[[0,0],[0,0]]</pre></div>
        <div><strong>Inverse(A):</strong> <pre id="invA">[[0,0],[0,0]]</pre></div>
      </div>
    </div>
  </main>
  <footer>
    <p>Engineered by <a href="https://github.com/sabhyamtrivedycoder" target="_blank">Sabhyam Trivedy</a> • MIT License</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
